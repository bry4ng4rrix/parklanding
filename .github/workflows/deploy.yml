# Vérifie la landing, construit l'image Docker (publiée sur GHCR) puis la déploie sur le VPS, port 3003.
# Secrets à définir dans Settings → Secrets and variables → Actions :
#   VPS_HOST         adresse du VPS
#   VPS_USER         utilisateur SSH (membre du groupe docker)
#   VPS_SSH_KEY      clé privée de déploiement (ed25519)
#   VPS_KNOWN_HOSTS  empreintes du VPS (sortie de ssh-keyscan)
name: Build & déploiement

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository }}
  CONTAINER: parklanding
  PORT: 3003

jobs:
  check:
    name: Typecheck & build Next.js
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc --noEmit
      - run: pnpm build

  image:
    name: Image Docker
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long
            type=ref,event=pr
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Déploiement VPS
    needs: image
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Clé SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          failed=0
          require() { [ -n "$2" ] || { echo "::error::Secret $1 absent ou vide (Settings → Secrets and variables → Actions → Repository secrets)"; failed=1; }; }
          require VPS_HOST "$VPS_HOST"; require VPS_USER "$VPS_USER"; require VPS_SSH_KEY "$SSH_KEY"; require VPS_KNOWN_HOSTS "$KNOWN_HOSTS"
          [ "$failed" = 0 ] || exit 1

          # tolère les espaces, les fins de ligne Windows et un « utilisateur@ » collé dans VPS_HOST
          host=$(printf '%s' "$VPS_HOST" | tr -d '[:space:]'); host=${host#*@}
          user=$(printf '%s' "$VPS_USER" | tr -d '[:space:]')
          echo "::add-mask::$host"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" | tr -d '\r' > ~/.ssh/known_hosts
          ssh-keygen -F "$host" -f ~/.ssh/known_hosts > /dev/null || {
            echo "::error::VPS_KNOWN_HOSTS ne contient aucune empreinte pour VPS_HOST : y coller la sortie complète de « ssh-keyscan <adresse du VPS> », avec la même adresse que VPS_HOST"
            exit 1
          }
          echo "TARGET=$user@$host" >> "$GITHUB_ENV"

      - name: Pull de l'image et redémarrage du conteneur
        env:
          TAG: ${{ env.IMAGE }}:sha-${{ github.sha }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # le jeton du workflow ne sert qu'au pull et expire à la fin du job
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes "$TARGET" bash -s <<EOF
          set -euo pipefail
          echo '$GHCR_TOKEN' | docker login ghcr.io -u '$GHCR_USER' --password-stdin
          docker pull '$TAG'
          docker logout ghcr.io
          docker rm -f '$CONTAINER' 2>/dev/null || true
          docker run -d --name '$CONTAINER' --restart unless-stopped -p $PORT:3003 '$TAG'
          for i in \$(seq 1 20); do curl -fsS -o /dev/null http://127.0.0.1:$PORT/ && break; sleep 2; done
          curl -fsS -o /dev/null http://127.0.0.1:$PORT/
          docker image prune -f
          EOF
